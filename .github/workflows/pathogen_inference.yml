name: Pathogen inference

on:
  schedule:
    # Daily at 21:00 UTC = 18:00 in Minas Gerais (BRT, UTC-3, no DST since 2019).
    # After local noon, so the issue date is "today" and night 1 is tonight.
    - cron: "0 21 * * *"
  # Also refresh after every push, so code, model or dashboard changes go live with a
  # current forecast. The bot's own commits use GITHUB_TOKEN and never retrigger this.
  push:
    branches: [main]
    paths-ignore: [docs/rust_risk.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pathogen-inference
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies (CPU-only)
        run: pip install -r requirements.txt

      # One retry after 10 minutes rides out short Open-Meteo outages.
      - name: Generate 7-night forecast
        run: |
          python -m src.update_forecast || {
            echo "Forecast failed, retrying in 10 minutes."
            sleep 600
            python -m src.update_forecast
          }

      - name: Commit updated forecast
        run: |
          if git diff --quiet -- docs/rust_risk.json; then
            echo "Forecast unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rust_risk.json
          git commit -m "Update rust risk forecast $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
