name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest pyflakes

      - name: Lint
        run: pyflakes src tests scripts

      # Tests that need the downloaded archives skip themselves; the synthetic
      # pipeline tests and the committed model are always exercised.
      - name: Test
        run: pytest -q -rs
